<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HBC Admin Panel - Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <i class="fa-solid fa-house-medical"></i>
          HBC Admin
        </div>
        <button id="closeSidebar"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <a href="dashboard.html" class="menu-item active">
        <i class="fa-solid fa-gauge"></i> Dashboard
      </a>
      <a href="#" class="menu-item">
        <i class="fa-solid fa-book"></i> Programs
      </a>
      <a href="#" class="menu-item">
        <i class="fa-solid fa-user-graduate"></i> Students
      </a>
      <a href="#" class="menu-item">
        <i class="fa-solid fa-chalkboard-user"></i> Instructors
      </a>
      <a href="#" class="menu-item">
        <i class="fa-solid fa-graduation-cap"></i> Graduates
      </a>
      <a href="#" class="menu-item">
        <i class="fa-solid fa-diagram-project"></i> Projects
      </a>
      <a href="#" class="menu-item">
        <i class="fa-solid fa-chart-line"></i> Reports
      </a>
      <a href="#" class="menu-item">
        <i class="fa-solid fa-gear"></i> Settings
      </a>
    </aside>

    <div class="overlay" id="overlay"></div>

    <div class="main">
      <header class="navbar">
        <div class="navbar-left">
          <button id="menuToggle"><i class="fa-solid fa-bars"></i></button>

          <div class="title-block">
            <div class="breadcrumb">
              <i class="fa-solid fa-house"></i> / Dashboard
            </div>
            <div class="page-title">Dashboard</div>
          </div>
        </div>

        <div class="navbar-right">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Type here..." />
          </div>

          <a href="logout.html" id="logoutBtn">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Log out
          </a>

          <i class="fa-solid fa-gear icon-btn"></i>
          <i class="fa-solid fa-bell icon-btn"></i>
        </div>
      </header>

      <main class="content">
        <h1>Welcome to HBC Admin Panel!</h1>
      </main>
    </div>

    <script src="js/dashboard.js"></script>
  </body>
</html>
